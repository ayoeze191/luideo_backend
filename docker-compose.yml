# Local Postgres for development: `npm run db:up`
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: luideo
      POSTGRES_PASSWORD: luideo
      POSTGRES_DB: luideo
    ports:
      - "5433:5432"
    volumes:
      - luideo-pg:/var/lib/postgresql/data

volumes:
  luideo-pg:
